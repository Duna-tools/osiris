[package]
name = "osiris-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "osiris-server"
path = "src/main.rs"

[dependencies]
osiris-domain = { workspace = true }
osiris-application = { workspace = true }
osiris-mcp = { workspace = true }
osiris-policy = { workspace = true }
osiris-ipc-client = { workspace = true }
osiris-telemetry = { workspace = true }
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"
