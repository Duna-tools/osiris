[package]
name = "osiris-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "osiris-server"
path = "src/main.rs"

[dependencies]
osiris-domain = { workspace = true }
osiris-application = { workspace = true }
osiris-mcp = { workspace = true }
osiris-policy = { workspace = true }
osiris-ipc-client = { workspace = true }
osiris-telemetry = { workspace = true }
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.151"
