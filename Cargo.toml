[workspace]
resolver = "3"
members = [
    "crates/osiris-domain",
    "crates/osiris-application",
    "crates/osiris-mcp",
    "crates/osiris-policy",
    "crates/osiris-ipc-contract",
    "crates/osiris-ipc-client",
    "crates/osiris-telemetry",
    "crates/osiris-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "MCP server for Godot project inspection, modification and execution"
repository = "https://github.com/Duna-tools/osiris"
readme = "README.md"
keywords = ["godot", "mcp", "game-dev", "editor"]
categories = ["development-tools", "game-engines"]

[workspace.dependencies]
osiris-domain = { path = "crates/osiris-domain" }
osiris-application = { path = "crates/osiris-application" }
osiris-policy = { path = "crates/osiris-policy" }
osiris-ipc-contract = { path = "crates/osiris-ipc-contract" }
osiris-ipc-client = { path = "crates/osiris-ipc-client" }
osiris-mcp = { path = "crates/osiris-mcp" }
osiris-telemetry = { path = "crates/osiris-telemetry" }
tracing = { version = "0.1.44", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry", "json"] }

[profile.release]
lto = true

