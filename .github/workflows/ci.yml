name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - name: Conformance MCP (cliente stdio real)
        run: |
          ./target/debug/osiris conformance
      - name: Scan de secretos
        run: |
          if grep -rn -iE "(api[_-]?key|secret|password|token)\s*=\s*['\"][^'\"]{8,}" --include="*.rs" --include="*.toml" . | grep -v "osiris_ipc_token\|ipc-token\|token_file\|TOKEN_FILE"; then
            echo "Secreto potencial detectado"; exit 1
          fi
